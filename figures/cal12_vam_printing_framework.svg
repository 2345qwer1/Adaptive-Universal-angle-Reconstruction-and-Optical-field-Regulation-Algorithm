<?xml version="1.0" encoding="UTF-8"?>
<!-- CAL 1.2 VAM algorithm framework: 3D model, slice-to-mask, projection construction, forward dose model, adjoint-gradient optimization, and final quantization. -->
<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="1250" viewBox="0 0 2100 1250" role="img" aria-labelledby="svgtitle svgdesc">
  <title id="svgtitle">CAL 1.2 volumetric additive manufacturing algorithm framework</title>
  <desc id="svgdesc">A three-domain algorithm flowchart: model and slice data at left, projection and dose operators in the center, and iterative projection optimization with final quantization at right.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#1a1a1a"/></marker>
    <marker id="arrgray" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#6f6f6f"/></marker>
    <style>
      .bg{fill:#fff}.domain{fill:#fafafa;stroke:#222;stroke-width:2;stroke-dasharray:5 5}.box{fill:#fff;stroke:#161616;stroke-width:2.4}.soft{fill:#f5f5f5;stroke:#161616;stroke-width:2.4}.process{fill:#eaf2f8;stroke:#1f4e79;stroke-width:2.7}.physics{fill:#edf5ed;stroke:#3c6e47;stroke-width:2.7}.optim{fill:#fff3df;stroke:#a96409;stroke-width:2.7}.out{fill:#f3eef8;stroke:#654e83;stroke-width:2.7}.line{fill:none;stroke:#161616;stroke-width:2.6;marker-end:url(#arr)}.thin{fill:none;stroke:#161616;stroke-width:2;marker-end:url(#arr)}.feedback{fill:none;stroke:#1f4e79;stroke-width:2.7;marker-end:url(#arr)}.dash{fill:none;stroke:#6f6f6f;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrgray)}.t{font-family:Arial,Helvetica,sans-serif;fill:#111}.title{font-size:34px;font-weight:700}.section{font-size:22px;font-weight:700;letter-spacing:1px}.label{font-size:22px;font-weight:700}.sub{font-size:17px}.small{font-size:15px}.math{font-size:20px;font-family:'Times New Roman',serif;font-style:italic}.op{font-size:25px;font-family:'Times New Roman',serif;font-style:italic;font-weight:700}.note{font-size:14px;fill:#555}.tag{font-size:15px;font-weight:700;fill:#1f4e79}.tagg{font-size:15px;font-weight:700;fill:#3c6e47}.tago{font-size:15px;font-weight:700;fill:#a96409}
    </style>
  </defs>
  <rect class="bg" width="2100" height="1250"/>
  <text x="1050" y="58" text-anchor="middle" class="t title">CAL 1.2 VAM Algorithm Framework: Projection Design and Dose-Domain Optimization</text>
  <text x="1050" y="88" text-anchor="middle" class="t sub">Two-dimensional slice simulation in a circular resin container</text>

  <!-- Left domain: model and target data -->
  <rect class="domain" x="55" y="135" width="525" height="970"/>
  <text x="318" y="169" text-anchor="middle" class="t section">MODEL AND TARGET DOMAIN</text>
  <text x="318" y="195" text-anchor="middle" class="t small">3D geometry transformed into a 2D target slice</text>
  <rect class="box" x="110" y="235" width="180" height="125"/>
  <path d="M142 324 C146 274,170 252,194 274 C212 238,252 260,249 297 C268 309,251 342,221 334 C199 357,159 346,142 324 Z" fill="#1a1a1a"/>
  <path d="M175 281 C189 297,204 312,231 324" fill="none" stroke="#fff" stroke-width="5"/>
  <text x="200" y="387" text-anchor="middle" class="t label">3D model</text>
  <text x="200" y="411" text-anchor="middle" class="t sub">CAD / voxel geometry</text>
  <rect class="process" x="330" y="248" width="195" height="100" rx="5"/>
  <text x="427" y="283" text-anchor="middle" class="t label">Slice at z</text>
  <text x="427" y="309" text-anchor="middle" class="t sub">binary 2D cross-section</text>
  <text x="427" y="332" text-anchor="middle" class="t tag">MODEL TO MASK</text>
  <path class="line" d="M290 298H330"/>
  <rect class="box" x="147" y="487" width="205" height="178"/>
  <circle cx="249" cy="566" r="67" fill="#111"/>
  <path d="M210 591 L238 525 L282 550 L271 605 Z" fill="#fff"/>
  <text x="249" y="698" text-anchor="middle" class="t label">Target mask</text>
  <text x="249" y="722" text-anchor="middle" class="t sub">T(x,y) in circular support</text>
  <path class="line" d="M427 348V432H249V487"/>
  <rect class="process" x="95" y="786" width="235" height="120" rx="5"/>
  <text x="212" y="821" text-anchor="middle" class="t label">Initial sinogram</text>
  <text x="212" y="848" text-anchor="middle" class="t sub">Radon[T(x,y)]</text>
  <text x="212" y="873" text-anchor="middle" class="t sub">column normalization</text>
  <text x="212" y="895" text-anchor="middle" class="t tag">generate_initial_sinogram()</text>
  <path class="line" d="M249 665V745H212V786"/>
  <rect class="soft" x="365" y="785" width="165" height="122"/>
  <path d="M384 873 L384 815 M404 873 L404 804 M424 873 L424 827 M444 873 L444 798 M464 873 L464 812 M484 873 L484 804 M504 873 L504 830" stroke="#111" stroke-width="9"/>
  <text x="447" y="935" text-anchor="middle" class="t small">sinogram S(s,theta)</text>
  <path class="line" d="M330 846H365"/>
  <text x="86" y="1072" class="t note">Input geometry and target data</text>

  <!-- Center domain: operators -->
  <rect class="domain" x="625" y="135" width="855" height="970"/>
  <text x="1052" y="169" text-anchor="middle" class="t section">PROJECTION AND DOSE OPERATORS</text>
  <text x="1052" y="195" text-anchor="middle" class="t small">Initial projection construction, forward printing model, and adjoint gradient transport</text>
  <rect class="process" x="685" y="267" width="295" height="202" rx="5"/>
  <text x="832" y="301" text-anchor="middle" class="t label">Initial projection design</text>
  <text x="832" y="331" text-anchor="middle" class="t sub">frequency-domain filtering</text>
  <text x="832" y="357" text-anchor="middle" class="t sub">attenuation pre-compensation</text>
  <text x="832" y="383" text-anchor="middle" class="t sub">exp(+alpha d) and clipping P >= 0</text>
  <text x="832" y="416" text-anchor="middle" class="t tag">generate_initial_projection_matrix()</text>
  <text x="832" y="440" text-anchor="middle" class="t tag">compensate_and_print_initial_projection()</text>
  <path class="line" d="M530 846H610V368H685"/>
  <rect class="optim" x="1040" y="282" width="220" height="170" rx="5"/>
  <text x="1150" y="317" text-anchor="middle" class="t label">Initial calibration</text>
  <text x="1150" y="346" text-anchor="middle" class="t sub">projection quantization</text>
  <text x="1150" y="371" text-anchor="middle" class="t sub">global scale k</text>
  <text x="1150" y="396" text-anchor="middle" class="t sub">maximize container IoU</text>
  <text x="1150" y="424" text-anchor="middle" class="t tago">P_init(s,theta)</text>
  <path class="line" d="M980 368H1040"/>
  <rect class="physics" x="881" y="583" width="344" height="204" rx="5"/>
  <text x="1053" y="618" text-anchor="middle" class="t label">Forward physical printing model</text>
  <text x="1053" y="649" text-anchor="middle" class="t sub">interpolate P(s,theta) at each voxel</text>
  <text x="1053" y="675" text-anchor="middle" class="t sub">Beer-Lambert attenuation</text>
  <text x="1053" y="701" text-anchor="middle" class="t math">D(x,y) = sum_theta P(s,theta) exp(-alpha d) Delta t</text>
  <text x="1053" y="731" text-anchor="middle" class="t sub">threshold: D(x,y) >= Ec -> cured(x,y)</text>
  <text x="1053" y="758" text-anchor="middle" class="t tagg">forward_dose_simulation()</text>
  <path class="line" d="M1150 452V520H1053V583"/>
  <text x="1164" y="504" class="t small">P_init or P^(n)</text>
  <rect class="soft" x="690" y="610" width="135" height="152"/>
  <circle cx="757" cy="670" r="36" fill="#111"/><path d="M736 685 L751 648 L780 662 L773 692 Z" fill="#fff"/>
  <text x="757" y="730" text-anchor="middle" class="t small">printout</text><text x="757" y="750" text-anchor="middle" class="t small">dose / cured mask</text>
  <path class="line" d="M881 685H825"/>
  <rect class="optim" x="690" y="857" width="286" height="168" rx="5"/>
  <text x="833" y="890" text-anchor="middle" class="t label">Dose-domain loss</text>
  <text x="833" y="920" text-anchor="middle" class="t sub">background overdose penalty</text>
  <text x="833" y="946" text-anchor="middle" class="t sub">target underdose penalty</text>
  <text x="833" y="973" text-anchor="middle" class="t math">L(D,T), dL/dD</text>
  <text x="833" y="1002" text-anchor="middle" class="t tago">compute_loss_and_grad_wrt_dose()</text>
  <path class="line" d="M881 730H833V857"/>
  <path class="feedback" d="M976 941H1320V815"/>
  <text x="1110" y="928" text-anchor="middle" class="t op">Adjoint / gradient backpropagation: dL/dD -> dL/dP</text>
  <text x="639" y="1072" class="t note">Solid arrows: model/data propagation; blue feedback: gradient transport</text>

  <!-- Right domain: optimization state -->
  <rect class="domain" x="1525" y="135" width="520" height="970"/>
  <text x="1785" y="169" text-anchor="middle" class="t section">OPTIMIZATION AND OUTPUT DOMAIN</text>
  <text x="1785" y="195" text-anchor="middle" class="t small">continuous optimization followed by discrete projector output</text>
  <rect class="box" x="1650" y="250" width="270" height="118"/>
  <text x="1785" y="288" text-anchor="middle" class="t label">Continuous projection</text>
  <text x="1785" y="320" text-anchor="middle" class="t math">P^(n)(s,theta)</text>
  <text x="1785" y="346" text-anchor="middle" class="t sub">non-negative intensity matrix</text>
  <path class="line" d="M1785 368V505H1225"/>
  <rect class="optim" x="1630" y="550" width="310" height="180" rx="5"/>
  <text x="1785" y="586" text-anchor="middle" class="t label">Projection update</text>
  <text x="1785" y="618" text-anchor="middle" class="t sub">gradient descent</text>
  <text x="1785" y="644" text-anchor="middle" class="t sub">backtracking line search</text>
  <text x="1785" y="670" text-anchor="middle" class="t math">P^(n+1) = max[0, P^(n) - eta dL/dP]</text>
  <text x="1785" y="702" text-anchor="middle" class="t tago">optimize_projection_matrix()</text>
  <path class="line" d="M1320 815H1510V640H1630"/>
  <path class="feedback" d="M1785 550V470H1990V309H1920"/>
  <text x="1924" y="455" text-anchor="middle" class="t small">repeat until convergence</text>
  <polygon points="1785,790 1870,850 1785,910 1700,850" class="soft"/>
  <text x="1785" y="841" text-anchor="middle" class="t label">Stop?</text>
  <text x="1785" y="866" text-anchor="middle" class="t small">tolerance or max iterations</text>
  <path class="line" d="M1785 730V790"/>
  <path class="dash" d="M1700 850H1570V640H1630"/>
  <text x="1584" y="830" class="t small">No</text>
  <rect class="out" x="1640" y="965" width="290" height="100" rx="5"/>
  <text x="1785" y="999" text-anchor="middle" class="t label">Final discrete projection</text>
  <text x="1785" y="1027" text-anchor="middle" class="t sub">quantize to {0, T, ..., KT}</text>
  <text x="1785" y="1050" text-anchor="middle" class="t sub">P_final(s,theta), dose, cured mask, IoU</text>
  <path class="line" d="M1785 910V965"/>
  <text x="1878" y="944" class="t small">Yes</text>

  <!-- Legend and scope -->
  <g transform="translate(90,1165)">
    <rect x="0" y="-18" width="18" height="18" class="process"/><text x="28" y="-3" class="t small">projection / preprocessing</text>
    <rect x="285" y="-18" width="18" height="18" class="physics"/><text x="313" y="-3" class="t small">physical forward model</text>
    <rect x="560" y="-18" width="18" height="18" class="optim"/><text x="588" y="-3" class="t small">calibration / optimization</text>
    <rect x="865" y="-18" width="18" height="18" class="out"/><text x="893" y="-3" class="t small">final output</text>
    <path class="feedback" d="M1110 -10H1175"/><text x="1190" y="-3" class="t small">iterative gradient feedback</text>
  </g>
  <text x="90" y="1215" class="t note">Scope of this framework: 2D slice dose simulation with circular support and Beer-Lambert attenuation; it does not represent multiple scattering, refraction, wave-optical propagation, nonlinear photochemistry, or 3D interlayer coupling.</text>
</svg>
